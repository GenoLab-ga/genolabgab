name: Semgrep Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    continue-on-error: false
    steps:
      - uses: actions/checkout@<SHA_40_CAR> # v4.x.x

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config p/nextjs \
            --config p/javascript \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif --output=semgrep.sarif \
            --error
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@<SHA_40_CAR> # v3.x.x
        with:
          sarif_file: semgrep.sarif
